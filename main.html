  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          colors: {
            darkBg: '#090d16',
            darkCard: 'rgba(17, 25, 40, 0.72)',
            lightBg: '#f1f5f9',
            lightCard: 'rgba(255, 255, 255, 0.82)',
          },
          animation: {
            'blob': 'blob 12s infinite alternate',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -40px) scale(1.08)' },
              '66%': { transform: 'translate(-20px, 25px) scale(0.95)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* カスタムグラスモーフィズム＆マイクロインタラクション用スタイル */
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .glass-panel {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.3s ease,
                  background-color 0.35s ease;
    }

    .bento-card {
      position: relative;
      overflow: hidden;
    }

    /* カードのホバー時光沢スイープ効果 */
    .bento-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      transform: skewX(-25deg);
      transition: left 0.65s ease;
      pointer-events: none;
    }

    .bento-card:hover::before {
      left: 160%;
    }

    .bento-card:hover {
      transform: translateY(-4px);
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.55);
    }
  </style>
</head>

        description: 'お絵描きやイラストをテーマに気軽に遊べるブラウザゲーム。スマホでもPCでもサクッと楽しめます。',
        tags: ['イラスト', 'カジュアルゲーム', 'HTML5'],
        keywords: 'イラストゲーム お絵描き game ブラウザゲーム カジュアル',
        colSpanClass: 'md:col-span-1 lg:col-span-6', // PCでは下段右ハーフBentoカード
        featured: false,
        accentGradient: 'from-emerald-500 via-teal-500 to-cyan-600',
        badgeBg: 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 border-emerald-500/25',
        buttonBg: 'bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 shadow-emerald-500/25',
        iconSvg: `
          <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
        `
      }
    ];

    // アプリケーション状態（localStorageに保存）
    let openInNewTab = true;
    let searchQuery = '';

    /**
     * 初期化処理
     */
    function init() {
      // 保存されたテーマ設定の復元
      const savedTheme = localStorage.getItem('doraigx_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }

      // 保存されたリンク挙動（新しいタブ vs 現在のタブ）の復元
      const savedTarget = localStorage.getItem('doraigx_open_new_tab');
      if (savedTarget !== null) {
        openInNewTab = savedTarget === 'true';
      }
      updateTargetToggleUI();

      // 時計の開始
      updateClock();
      setInterval(updateClock, 1000);

      // カードの初回描画
      renderCards();

      // イベントリスナー登録
      setupEventListeners();
    }

    /**
     * ライブ時計・日付の更新
     */
    function updateClock() {
      const now = new Date();
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const weekday = weekdays[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      const clockEl = document.getElementById('live-clock');
      if (clockEl) {
        clockEl.textContent = `${year}年${month}月${day}日 (${weekday})  ${hours}:${minutes}`;
      }
    }

    /**
     * ダーク / ライトモード切り替え
     */
    function toggleTheme() {
      const htmlEl = document.documentElement;
      const isDark = htmlEl.classList.toggle('dark');
      localStorage.setItem('doraigx_theme', isDark ? 'dark' : 'light');
      showToast(isDark ? 'ダークモードに切り替えました' : 'ライトモードに切り替えました');
    }

    /**
     * リンクを開くターゲット（新しいタブ / 現在のタブ）切り替え
     */
    function toggleOpenTarget() {
      openInNewTab = !openInNewTab;
      localStorage.setItem('doraigx_open_new_tab', String(openInNewTab));
      updateTargetToggleUI();
      showToast(openInNewTab ? 'リンクを新しいタブで開きます' : 'リンクを現在のタブで開きます');
    }

    /**
     * ターゲット切り替えボタンの表示更新
     */
    function updateTargetToggleUI() {
      const label = document.getElementById('target-label');
      const indicator = document.getElementById('target-indicator');
      if (openInNewTab) {
        label.textContent = '新しいタブで開く';
        indicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.7)] transition-colors';
      } else {
        label.textContent = '現在のタブで開く';
        indicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.7)] transition-colors';
      }
    }

    /**
     * アプリケーションを実際に開く
     */
    function launchApp(url, title) {
      if (openInNewTab) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    /**
     * URLクリップボードコピー（iFrame制約も考慮したフォールバック付き）
     */
    function copyAppUrl(event, url, title) {
      event.stopPropagation();
      const textArea = document.createElement('textarea');
      textArea.value = url;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(`「${title}」のURLをコピーしました`);
      } catch (err) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            showToast(`「${title}」のURLをコピーしました`);
          });
        }
      }
      document.body.removeChild(textArea);
    }

    /**
     * クイックプレビューモーダルを開く
     */
    function openPreviewModal(event, appId) {
      event.stopPropagation();
      const app = APPS.find(item => item.id === appId);
      if (!app) return;

      const modal = document.getElementById('preview-modal');
      const titleEl = document.getElementById('preview-title');
      const urlEl = document.getElementById('preview-url-text');
      const iframe = document.getElementById('preview-iframe');
      const loader = document.getElementById('preview-loader');
      const fullBtn = document.getElementById('preview-open-full-btn');

      titleEl.textContent = `${app.title} — クイックプレビュー`;
      urlEl.textContent = app.url;
      loader.classList.remove('hidden');
      iframe.src = app.url;

      fullBtn.onclick = () => {
        closePreviewModal();
        launchApp(app.url, app.title);
      };

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    /**
     * クイックプレビューモーダルを閉じる
     */
    function closePreviewModal(event) {
      if (event && event.target !== document.getElementById('preview-modal')) {
        return;
      }
      const modal = document.getElementById('preview-modal');
      const iframe = document.getElementById('preview-iframe');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      iframe.src = 'about:blank';
      document.body.style.overflow = '';
    }

    /**
     * Bento Grid カードのレンダリング
     */
    function renderCards() {
      const grid = document.getElementById('apps-grid');
      const noMatchBox = document.getElementById('no-match-box');
      const query = searchQuery.trim().toLowerCase();

      const filteredApps = APPS.filter(app => {
        if (!query) return true;
        return (
          app.title.toLowerCase().includes(query) ||
          app.subtitle.toLowerCase().includes(query) ||
          app.description.toLowerCase().includes(query) ||
          app.keywords.toLowerCase().includes(query) ||
          app.tags.some(t => t.toLowerCase().includes(query))
        );
      });

      if (filteredApps.length === 0) {
        grid.innerHTML = '';
        noMatchBox.classList.remove('hidden');
        document.getElementById('fallback-search-text').textContent = `「${searchQuery}」を Google で検索する`;
        return;
      }

      noMatchBox.classList.add('hidden');

      grid.innerHTML = filteredApps.map(app => {
        const tagsHtml = app.tags.map(tag => `
          <span class="px-2.5 py-1 text-[11px] font-semibold rounded-lg border ${app.badgeBg}">
            ${tag}
          </span>
        `).join('');

        // 最上段のポータルカードはPCで横長のレイアウト構成にしてBento Grid感を強調
        const layoutInnerClass = app.featured
          ? 'flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6'
          : 'flex flex-col justify-between h-full gap-6';

        const actionAreaClass = app.featured
          ? 'flex flex-wrap sm:flex-nowrap items-center gap-2.5 lg:shrink-0'
          : 'flex flex-wrap sm:flex-nowrap items-center gap-2.5 pt-2 border-t border-slate-200/70 dark:border-slate-700/60';

        return `
          <article
            onclick="launchApp('${app.url}', '${app.title}')"
            class="bento-card glass-panel ${app.colSpanClass} rounded-3xl bg-lightCard dark:bg-darkCard border border-slate-200/80 dark:border-slate-700/70 p-6 sm:p-7 shadow-lg shadow-slate-900/5 dark:shadow-black/30 hover:border-indigo-400/70 dark:hover:border-indigo-400/60 cursor-pointer group"
          >
            <div class="${layoutInnerClass}">
              <!-- 左側 / 上側: アイコン・タイトル・説明 -->
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-4 mb-4">
                  <div class="flex items-center gap-4">
                    <!-- グラデーションアイコンボックス -->
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${app.accentGradient} flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform duration-300 shrink-0">
                      ${app.iconSvg}
                    </div>
                    <div>
                      <div class="flex items-center gap-2 flex-wrap">
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition-colors">
                          ${app.title}
                        </h2>
                        <span class="hidden sm:inline-flex items-center justify-center px-2 py-0.5 text-[11px] font-mono font-bold rounded-md bg-slate-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-300/80 dark:border-slate-700">
                          Key: ${app.shortcutKey}
                        </span>
                      </div>
                      <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-0.5">
                        ${app.subtitle}
                      </p>
                    </div>
                  </div>
                </div>

                <!-- 説明文 -->
                <p class="text-sm sm:text-[15px] leading-relaxed text-slate-600 dark:text-slate-300 mb-4 ${app.featured ? 'max-w-2xl' : ''}">
                  ${app.description}
                </p>

                <!-- タグ一覧 ＆ URL表示 -->
                <div class="flex flex-wrap items-center gap-2">
                  ${tagsHtml}
                  <span class="text-xs font-mono text-slate-400 dark:text-slate-500 truncate ml-1">
                    ${app.url.replace('https://', '')}
                  </span>
                </div>
              </div>

              <!-- 右側 / 下側: アクションボタン群（スマホでも片手でタップしやすいサイズ） -->
              <div class="${actionAreaClass}">
                <!-- クイックプレビューボタン -->
                <button
                  type="button"
                  onclick="openPreviewModal(event, '${app.id}')"
                  class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-4 py-3 rounded-2xl bg-slate-200/75 dark:bg-slate-800/90 hover:bg-slate-300/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs sm:text-sm font-semibold transition-colors cursor-pointer"
                  title="モーダル内でプレビュー表示"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <span>プレビュー</span>
                </button>

                <!-- URLコピーボタン -->
                <button
                  type="button"
                  onclick="copyAppUrl(event, '${app.url}', '${app.title}')"
                  class="p-3 rounded-2xl bg-slate-200/75 dark:bg-slate-800/90 hover:bg-slate-300/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors cursor-pointer shrink-0"
                  title="URLをコピー"
                  aria-label="URLをコピー"
                >
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>

                <!-- メイン起動ボタン -->
                <button
                  type="button"
                  onclick="event.stopPropagation(); launchApp('${app.url}', '${app.title}')"
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl ${app.buttonBg} text-white text-sm font-bold shadow-lg transition-all cursor-pointer"
                >
                  <span>開く</span>
                  <svg class="w-4 h-4 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    /**
     * 検索クリア処理
     */
    function clearSearch() {
      const searchInput = document.getElementById('search-input');
      searchInput.value = '';
      searchQuery = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderCards();
      searchInput.focus();
    }

    /**
     * Google検索を実行（スタートページとしての利便性向上）
     */
    function executeWebSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
      launchApp(googleUrl, 'Google検索');
    }

    /**
     * トースト通知を表示
     */
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-2xl bg-slate-900/95 dark:bg-slate-800/95 text-white text-xs sm:text-sm font-medium shadow-xl border border-slate-700/80 flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0';
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2400);
    }

    /**
     * 検索バーとキーボードショートカットのイベント登録
     */
    function setupEventListeners() {
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search-btn');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchQuery.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        renderCards();
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const q = searchInput.value.trim().toLowerCase();
          // 完全一致または1件だけ絞り込まれている場合はそのアプリを開く
          const matched = APPS.filter(app =>
            app.title.toLowerCase().includes(q) ||
            app.keywords.toLowerCase().includes(q)
          );
          if (q && matched.length === 1) {
            launchApp(matched[0].url, matched[0].title);
          } else if (q) {
            executeWebSearch();
          }
        } else if (e.key === 'Escape') {
          clearSearch();
          searchInput.blur();
        }
      });

      // グローバルキーボードショートカット（1, 2, 3, /, Escape）
      document.addEventListener('keydown', (e) => {
        const activeTag = document.activeElement.tagName.toLowerCase();
        const isTyping = activeTag === 'input' || activeTag === 'textarea';

        // Escapeでモーダルを閉じる
        if (e.key === 'Escape') {
          const modal = document.getElementById('preview-modal');
          if (!modal.classList.contains('hidden')) {
            closePreviewModal();
          }
          return;
        }

        if (isTyping) return;

        // '/' キーで検索バーにフォーカス
        if (e.key === '/') {
          e.preventDefault();
          searchInput.focus();
          return;
        }

        // '1', '2', '3' キーで対応するアプリを即座に起動
        const targetApp = APPS.find(app => app.shortcutKey === e.key);
        if (targetApp) {
          e.preventDefault();
          showToast(`ショートカット [${e.key}]: ${targetApp.title} を起動します`);
          launchApp(targetApp.url, targetApp.title);
        }
      });
    }

    // ページ読み込み完了時に初期化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
