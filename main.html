    }

    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.55);

        id: 'record-android',
        category: 'android',
        categoryLabel: 'Androidアプリ',
        shortcutKey: '6',
        title: 'Record',
        subtitle: 'Android Application (APK)',
        url: 'https://doraigx.github.io/Potal_1/record.apk',
        actionLabel: 'APKダウンロード',
        description: 'Android端末向けの記録・ユーティリティアプリ。APKファイルを直接ダウンロードして端末へインストールできます。',
        tags: ['Androidアプリ', 'APK', '直接インストール'],
        keywords: 'android アプリ record record.apk apk ダウンロード インストール アンドロイド',
        colSpanClass: 'md:col-span-1 lg:col-span-6',
        featured: false,
        accentGradient: 'from-lime-500 to-green-600',
        categoryBadgeBg: 'bg-lime-500/15 text-lime-700 dark:text-lime-300 border-lime-500/25',
        badgeBg: 'bg-slate-500/10 text-slate-600 dark:text-slate-300 border-slate-500/20',
        buttonBg: 'bg-green-600 hover:bg-green-500',
        iconSvg: `
          <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2.5"></rect>
            <circle cx="12" cy="11" r="3"></circle>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
        `
      }
    ];

    // アプリケーション状態
    let openInNewTab = true;
    let activeCategory = 'all';
    let searchQuery = '';

    /**
     * 初期化処理
     */
    function init() {
      const savedTheme = localStorage.getItem('doraigx_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }

      const savedTarget = localStorage.getItem('doraigx_open_new_tab');
      if (savedTarget !== null) {
        openInNewTab = savedTarget === 'true';
      }
      updateTargetToggleUI();

      updateClock();
      setInterval(updateClock, 1000);

      renderCategoryTabs();
      renderContent();
      setupEventListeners();
    }

    /**
     * ライブ時計・日付の更新
     */
    function updateClock() {
      const now = new Date();
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const weekday = weekdays[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      const clockEl = document.getElementById('live-clock');
      if (clockEl) {
        clockEl.textContent = `${year}年${month}月${day}日 (${weekday})  ${hours}:${minutes}`;
      }
    }

    /**
     * ダーク / ライトモード切り替え
     */
    function toggleTheme() {
      const htmlEl = document.documentElement;
      const isDark = htmlEl.classList.toggle('dark');
      localStorage.setItem('doraigx_theme', isDark ? 'dark' : 'light');
      showToast(isDark ? 'ダークモードに切り替えました' : 'ライトモードに切り替えました');
    }

    /**
     * リンクを開くターゲット切り替え
     */
    function toggleOpenTarget() {
      openInNewTab = !openInNewTab;
      localStorage.setItem('doraigx_open_new_tab', String(openInNewTab));
      updateTargetToggleUI();
      showToast(openInNewTab ? 'リンクを新しいタブで開きます' : 'リンクを現在のタブで開きます');
    }

    /**
     * ターゲット切り替えボタンの表示更新
     */
    function updateTargetToggleUI() {
      const label = document.getElementById('target-label');
      const indicator = document.getElementById('target-indicator');
      if (openInNewTab) {
        label.textContent = '新しいタブで開く';
        indicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
      } else {
        label.textContent = '現在のタブで開く';
        indicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-500';
      }
    }

    /**
     * ジャンル選択切り替え
     */
    function selectCategory(categoryId) {
      activeCategory = categoryId;
      renderCategoryTabs();
      renderContent();
    }

    /**
     * ジャンルタブの描画（件数バッジ付き）
     */
    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = CATEGORIES.map(cat => {
        const count = cat.id === 'all'
          ? APPS.length
          : APPS.filter(app => app.category === cat.id).length;

        const isActive = activeCategory === cat.id;
        const btnClass = isActive
          ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm'
          : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200';

        const countClass = isActive
          ? 'bg-indigo-600 text-white'
          : 'bg-slate-300/70 dark:bg-slate-800 text-slate-600 dark:text-slate-400';

        return `
          <button
            type="button"
            onclick="selectCategory('${cat.id}')"
            class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition-colors cursor-pointer ${btnClass}"
          >
            <span>${cat.label}</span>
            <span class="px-1.5 py-0.5 text-[11px] rounded-md font-mono ${countClass}">${count}</span>
          </button>
        `;
      }).join('');
    }

    /**
     * アプリケーションを実際に開く
     */
    function launchApp(url) {
      if (openInNewTab) {
        window.open(url, '_blank', 'noopener,noreferrer');
      } else {
        window.location.href = url;
      }
    }

    /**
     * URLクリップボードコピー
     */
    function copyAppUrl(event, url, title) {
      event.stopPropagation();
      const textArea = document.createElement('textarea');
      textArea.value = url;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(`「${title}」のURLをコピーしました`);
      } catch (err) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            showToast(`「${title}」のURLをコピーしました`);
          });
        }
      }
      document.body.removeChild(textArea);
    }

    /**
     * 個別カードHTML生成
     */
    function createCardHtml(app) {
      const tagsHtml = app.tags.slice(1).map(tag => `
        <span class="px-2.5 py-0.5 text-[11px] font-medium rounded-lg border ${app.badgeBg}">
          ${tag}
        </span>
      `).join('');

      const layoutInnerClass = app.featured && activeCategory === 'all' && !searchQuery
        ? 'flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5'
        : 'flex flex-col justify-between h-full gap-5';

      const actionAreaClass = app.featured && activeCategory === 'all' && !searchQuery
        ? 'flex items-center gap-2.5 lg:shrink-0'
        : 'flex items-center gap-2.5 pt-3 border-t border-slate-200/80 dark:border-slate-800';

      const effectiveColSpan = (app.featured && (activeCategory !== 'all' || searchQuery))
        ? 'md:col-span-1 lg:col-span-6'
        : app.colSpanClass;

      return `
        <article
          onclick="launchApp('${app.url}')"
          class="bento-card surface-card ${effectiveColSpan} rounded-3xl bg-lightCard dark:bg-darkCard border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm hover:border-indigo-400/70 dark:hover:border-indigo-500/60 cursor-pointer group"
        >
          <div class="${layoutInnerClass}">
            <!-- アイコン・タイトル・説明 -->
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-3 mb-3.5">
                <div class="flex items-center gap-3.5 min-w-0">
                  <div class="w-13 h-13 w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br ${app.accentGradient} flex items-center justify-center shadow-sm shrink-0">
                    ${app.iconSvg}
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="px-2 py-0.5 text-[11px] font-bold rounded-md border ${app.categoryBadgeBg}">
                        ${app.categoryLabel}
                      </span>
                      <span class="hidden sm:inline-flex items-center justify-center px-1.5 py-0.5 text-[11px] font-mono font-semibold rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                        Key: ${app.shortcutKey}
                      </span>
                    </div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white tracking-tight mt-1 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors truncate">
                      ${app.title}
                    </h2>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 truncate">
                      ${app.subtitle}
                    </p>
                  </div>
                </div>
              </div>

              <!-- 説明文 -->
              <p class="text-sm leading-relaxed text-slate-600 dark:text-slate-300 mb-3.5 ${app.featured ? 'max-w-2xl' : ''}">
                ${app.description}
              </p>

              <!-- タグ一覧 ＆ URL -->
              <div class="flex flex-wrap items-center gap-1.5">
                ${tagsHtml}
                <span class="text-[11px] font-mono text-slate-400 dark:text-slate-500 truncate ml-1">
                  ${app.url.replace('https://', '')}
                </span>
              </div>
            </div>

            <!-- アクションボタン群（URLコピー ＆ 開く） -->
            <div class="${actionAreaClass}">
              <button
                type="button"
                onclick="copyAppUrl(event, '${app.url}', '${app.title}')"
                class="p-3 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors cursor-pointer shrink-0"
                title="URLをコピー"
                aria-label="URLをコピー"
              >
                <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>

              <button
                type="button"
                onclick="event.stopPropagation(); launchApp('${app.url}')"
                class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl ${app.buttonBg} text-white text-sm font-bold transition-colors cursor-pointer"
              >
                <span>${app.actionLabel}</span>
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    /**
     * ジャンルセクション単位でのコンテンツ描画
     */
    function renderContent() {
      const container = document.getElementById('apps-container');
      const noMatchBox = document.getElementById('no-match-box');
      const query = searchQuery.trim().toLowerCase();

      const filteredApps = APPS.filter(app => {
        const matchesCategory = activeCategory === 'all' || app.category === activeCategory;
        if (!matchesCategory) return false;
        if (!query) return true;
        return (
          app.title.toLowerCase().includes(query) ||
          app.subtitle.toLowerCase().includes(query) ||
          app.description.toLowerCase().includes(query) ||
          app.categoryLabel.toLowerCase().includes(query) ||
          app.keywords.toLowerCase().includes(query) ||
          app.tags.some(t => t.toLowerCase().includes(query))
        );
      });

      if (filteredApps.length === 0) {
        container.innerHTML = '';
        noMatchBox.classList.remove('hidden');
        const fallbackBtnText = document.getElementById('fallback-search-text');
        fallbackBtnText.textContent = query ? `「${searchQuery}」を Google で検索する` : 'Google で検索する';
        return;
      }

      noMatchBox.classList.add('hidden');

      // ジャンルごとにグループ化してセクション見出し付きで表示
      const groups = [
        {
          id: 'web',
          title: 'Web',
          subtitle: 'ブラウザでそのまま使えるWebアプリ・ゲーム',
          dotColor: 'bg-sky-500'
        },
        {
          id: '3ds',
          title: '3DSソフト',
          subtitle: 'ニンテンドー3DS向け自作ソフト（GitHubリポジトリ）',
          dotColor: 'bg-rose-500'
        },
        {
          id: 'android',
          title: 'Androidアプリ',
          subtitle: 'Android端末向けアプリ（APKパッケージ）',
          dotColor: 'bg-lime-500'
        }
      ];

      const sectionsHtml = groups.map(group => {
        const groupApps = filteredApps.filter(app => app.category === group.id);
        if (groupApps.length === 0) return '';

        const cardsHtml = groupApps.map(app => createCardHtml(app)).join('');

        return `
          <section aria-labelledby="section-${group.id}">
            <div class="flex flex-wrap items-baseline justify-between gap-2 mb-3.5 px-1">
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full ${group.dotColor}"></span>
                <h2 id="section-${group.id}" class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900 dark:text-white">
                  ${group.title}
                </h2>
                <span class="px-2 py-0.5 text-xs font-mono font-semibold rounded-md bg-slate-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                  ${groupApps.length}
                </span>
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                ${group.subtitle}
              </p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-4 sm:gap-5">
              ${cardsHtml}
            </div>
          </section>
        `;
      }).join('');

      container.innerHTML = sectionsHtml;
    }

    /**
     * 検索クリア処理
     */
    function clearSearch() {
      const searchInput = document.getElementById('search-input');
      searchInput.value = '';
      searchQuery = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderContent();
      searchInput.focus();
    }

    /**
     * フィルター＆検索一括リセット
     */
    function resetFilters() {
      activeCategory = 'all';
      const searchInput = document.getElementById('search-input');
      searchInput.value = '';
      searchQuery = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderCategoryTabs();
      renderContent();
    }

    /**
     * Google検索を実行
     */
    function executeWebSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
      launchApp(googleUrl);
    }

    /**
     * 軽量トースト通知を表示
     */
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2.5 rounded-2xl bg-slate-900 dark:bg-slate-800 text-white text-xs sm:text-sm font-medium shadow-lg border border-slate-700 flex items-center gap-2 transition-opacity duration-150 opacity-0';
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 150);
      }, 2000);
    }

    /**
     * 検索バーとキーボードショートカットのイベント登録
     */
    function setupEventListeners() {
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search-btn');

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchQuery.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        renderContent();
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const q = searchInput.value.trim().toLowerCase();
          const matched = APPS.filter(app =>
            app.title.toLowerCase().includes(q) ||
            app.keywords.toLowerCase().includes(q)
          );
          if (q && matched.length === 1) {
            launchApp(matched[0].url);
          } else if (q) {
            executeWebSearch();
          }
        } else if (e.key === 'Escape') {
          clearSearch();
          searchInput.blur();
        }
      });

      // グローバルキーボードショートカット（1〜6, /）
      document.addEventListener('keydown', (e) => {
        const activeTag = document.activeElement.tagName.toLowerCase();
        const isTyping = activeTag === 'input' || activeTag === 'textarea';

        if (isTyping) return;

        if (e.key === '/') {
          e.preventDefault();
          searchInput.focus();
          return;
        }

        const targetApp = APPS.find(app => app.shortcutKey === e.key);
        if (targetApp) {
          e.preventDefault();
          showToast(`[${e.key}] ${targetApp.title} を開きます`);
          launchApp(targetApp.url);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
